[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.10.0",
]

[tool.mypy]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.vocab"
warn_return_any = false
