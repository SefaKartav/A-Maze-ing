[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator and solver, built for the 42 A-Maze-ing project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "sekartav" },
    { name = "fakartal" },
]
keywords = ["maze", "generator", "pathfinding", "bfs", "42"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "build",
]

[tool.setuptools]
packages = ["mazegen"]

[tool.flake8]
exclude = [".git", "__pycache__", ".venv", "build", "dist", "maze_analyzer.py"]

[tool.mypy]
python_version = "3.10"
exclude = ["maze_analyzer\\.py", "build/", "dist/"]
