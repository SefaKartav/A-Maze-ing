[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]
